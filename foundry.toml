[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Aevum runs the Shanghai EVM: avoid Cancun-only opcodes (MCOPY, TLOAD/TSTORE).
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
mantle_sepolia = "https://rpc.sepolia.mantle.xyz"
mantle_mainnet = "https://rpc.mantle.xyz"
