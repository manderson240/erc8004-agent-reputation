[project]
name = "erc8004-agent-reputation"
version = "0.2.0"
description = "ERC-8004 Verifiable Agent Identity, Confirmation-of-Payee Lookup & Reputation Registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eth-account>=0.13.0",
    "pydantic>=2.0.0",
    "web3>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
