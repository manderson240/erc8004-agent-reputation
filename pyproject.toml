[project]
name = "erc8004-agent-reputation"
version = "0.1.0"
description = "Verifiable On-Chain AI Agent Identity & Reputation Standard (ERC-8004) on Mantle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
